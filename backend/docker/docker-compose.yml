services:
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: nuit-supabase-db
    ports:
      - "54322:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: your-super-secret-supabase-password
      JWT_SECRET: your-super-secret-jwt-token-secret-key-change-in-prod
    volumes:
      - nuit_supabase_db_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres Meta API (Translates DB requests into REST for the Studio dashboard)
  supabase-meta:
    image: ghcr.io/supabase/postgres-meta:v0.84.0
    container_name: nuit-supabase-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: your-super-secret-supabase-password
    depends_on:
      supabase-db:
        condition: service_healthy

  # Supabase Studio Dashboard UI
  supabase-studio:
    image: supabase/studio:2024.01.22-sha-8356c9a
    container_name: nuit-supabase-studio
    ports:
      - "8000:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      DEFAULT_ORGANIZATION_NAME: Nuit Fragrances
      DEFAULT_PROJECT_NAME: AI Support Concierge
      SUPABASE_URL: http://localhost:8000
    depends_on:
      - supabase-meta
    restart: unless-stopped

volumes:
  nuit_supabase_db_data:
    driver: local
